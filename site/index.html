<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume</title>
  <meta name="description" content="Professional resume portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <a href="#top" class="identity" aria-label="Go to top">
      <span id="mark">RG</span>
      <span>
        <strong id="brand-name">Raj Ganatra</strong>
        <small>Finance • Credit • Asset Management</small>
      </span>
    </a>

    <button class="menu-button" id="menu-button" type="button" aria-label="Toggle navigation">Menu</button>
    <nav id="nav" aria-label="Resume sections"></nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-left">
        <p class="overline">Professional Portfolio</p>
        <h1 id="name">Raj Ganatra</h1>
        <p id="positioning">Finance professional focused on credit appraisal, asset management, MSME lending, portfolio monitoring and analytical decision-making.</p>
        <div class="hero-actions">
          <a class="button primary" href="./resume.pdf" target="_blank" rel="noreferrer">Open Resume PDF</a>
          <a class="button" id="linkedin-link" href="#" target="_blank" rel="noreferrer">LinkedIn</a>
          <a class="button" id="email-link" href="#">Contact</a>
        </div>
      </div>

      <aside class="hero-card">
        <p class="card-title">Contact</p>
        <div id="contact-card"></div>
      </aside>
    </section>

    <section class="quick-view">
      <div>
        <p class="overline">At a glance</p>
        <h2>Resume overview</h2>
      </div>
      <div id="overview-grid" class="overview-grid"></div>
    </section>

    <div id="sections"></div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
